name: CI

# Runs on every push to main and every pull request targeting main.
#
# Four stages:
#   1. lint  — fast static checks (type-check). Fails early before
#              burning matrix CI minutes.
#   2. test  — matrix (Node × NestJS × Prisma) unit + e2e + coverage. Gated behind
#              lint so invalid code never reaches the matrix.
#              PostgreSQL service container provides a real database for E2E.
#   3. modern-consumer — installs the packed package with exact NestJS 11.2.1
#              and Prisma 7.10.0 under strict peer resolution.
#   4. pack  — clean build + `npm pack --dry-run` to prove the tarball is
#              publish-ready. Single job because the output is identical
#              across the matrix.
#
# Security notes:
#   - No `${{ github.event.* }}` values are interpolated into `run:` shells.
#     The only templated expressions are `${{ matrix.* }}` (trusted, defined
#     in this file) and `${{ github.ref }}` (trusted, from the GitHub runner
#     environment). This avoids the workflow-injection class of bugs.
#   - Default permissions are reduced to `contents: read`.
#   - `concurrency` cancels superseded commits on the same ref.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --strict-peer-deps

      - name: Type check
        run: npm run lint

  test:
    name: Test (Node ${{ matrix.node }} × NestJS ${{ matrix.nestjs }} × Prisma ${{ matrix.prisma }})
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webhook_test
          POSTGRES_PASSWORD: webhook_test
          POSTGRES_DB: webhook_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U webhook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20'
            nestjs: '10'
            prisma: '6'
          - node: '22'
            nestjs: '10'
            prisma: '6'
          - node: '20'
            nestjs: '11'
            prisma: '6'
          - node: '22'
            nestjs: '11'
            prisma: '6'
          - node: '20'
            nestjs: '11'
            prisma: '7'
          - node: '22'
            nestjs: '11'
            prisma: '7'

    env:
      DATABASE_URL: postgresql://webhook_test:webhook_test@localhost:5433/webhook_test
      WEBHOOK_E2E_PRISMA_MAJOR: ${{ matrix.prisma }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --strict-peer-deps

      - name: Install exact NestJS 10 + Prisma 6 legacy tuple
        if: matrix.nestjs == '10'
        run: |
          npm install --no-save --package-lock=false --strict-peer-deps \
            @nestjs/common@10.4.20 \
            @nestjs/core@10.4.20 \
            @nestjs/platform-express@10.4.20 \
            @nestjs/testing@10.4.20 \
            @nestjs/schedule@4.1.2 \
            @prisma/client@6.19.3 \
            @prisma/adapter-pg@6.19.3 \
            prisma@6.19.3

      - name: Install exact Prisma 6 with NestJS 11
        if: matrix.nestjs == '11' && matrix.prisma == '6'
        run: |
          npm install --no-save --package-lock=false --strict-peer-deps \
            @prisma/client@6.19.3 \
            @prisma/adapter-pg@6.19.3 \
            prisma@6.19.3

      - name: Assert exact resolved compatibility tuple
        env:
          COMPAT_NESTJS: ${{ matrix.nestjs }}
          COMPAT_PRISMA: ${{ matrix.prisma }}
        run: node scripts/assert-installed-tuple.mjs

      - name: Generate Prisma 7 client
        if: matrix.prisma == '7'
        run: npm run prisma:generate

      - name: Generate Prisma 6 client
        if: matrix.prisma == '6'
        run: npm run prisma:generate:legacy

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

      - name: Coverage (primary cell only)
        if: matrix.node == '20' && matrix.nestjs == '11' && matrix.prisma == '7'
        run: npm run test:cov

      - name: Upload coverage artifact
        if: matrix.node == '20' && matrix.nestjs == '11' && matrix.prisma == '7'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  modern-consumer:
    name: Strict modern consumer (NestJS 11.2.1 × Prisma 7.10.0)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --strict-peer-deps

      - name: Verify packed artifact in a strict consumer
        run: npm run test:consumer:modern

  pack:
    name: Pack (publish dry-run)
    needs: [test, modern-consumer]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --strict-peer-deps

      - name: Build
        run: npm run build

      - name: Pack (dry run)
        run: npm pack --dry-run

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
